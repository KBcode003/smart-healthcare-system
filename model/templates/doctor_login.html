<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f2f2f2; font-family: 'Plus Jakarta Sans', sans-serif; }
        .form-container {
            max-width: 440px; margin: 100px auto; padding: 28px;
            background: teal; border-radius: 12px;
        }
        label { color: #ddd; }
        h3 { color: white; text-align: center; margin-bottom: 20px; }
        @media (max-width: 576px) {
    .form-container {
        margin: 40px auto;
        padding: 20px 16px;
    }
}
    </style>
</head>
<body>
<div class="form-container">
    <h3>👨‍⚕️ Doctor Login</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" name="email"
                   placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="password"
                   placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-success btn-block mt-2">Login</button>
        <a href="/" class="btn btn-outline-light btn-block mt-2">Back to Home</a>
    </form>
</div>
</body>
</html>
